name: Run bots

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: run-bots
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create token files
        env:
          T1: ${{ secrets.TOKEN_TXT }}
          T2: ${{ secrets.TOKEN_TELEGRAM_TXT }}
        run: |
          printf '%s\n' "$T1" > token.txt
          printf '%s\n' "$T2" > tokentelgram.txt
      - name: Run script for 5h50m
        run: timeout 350m npm start || true
      - name: Delete token files
        if: always()
        run: rm -f token.txt tokentelgram.txt
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run.yml --repo ${{ github.repository }}
